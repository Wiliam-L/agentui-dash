[project]
name = "agentui-dash"
version = "0.1.0"
description = "AgentUI Dash — Zero-config Streamlit dashboards generated by AI agents via MCP"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.57.0",
    "pandas>=2.0.0",
    "duckdb>=1.0.0",
    "plotly>=5.0.0",
    "openpyxl>=3.1.0",
    "python-calamine>=0.8.0",
    "kaleido>=1.0.0",
    "fpdf2>=2.8.0",
    "fastmcp>=2.0.0",
    "sqlglot>=30.33.0",
]

[project.scripts]
ui = "app_base.streamlit_ui.main:cli_entrypoint"
agentui-mcp = "agentui_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_base", "agentui_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]